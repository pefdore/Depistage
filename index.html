<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-list de dépistage — Tour d'horizon 360°</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🩺 Tour d'horizon 360° — dépistage</h1>
  <p class="subtitle">Check-list par appareil, adaptée au patient (sexe, âge). Recommandations HAS / dépistage organisé français. Aide-mémoire, ne remplace pas le jugement clinique. Risque cardiovasculaire global : voir risquecv.fr</p>
</header>

<main id="app">

  <section id="patient-info" class="card">
    <h2>Patient</h2>
    <div class="patient-grid">
      <label>Nom <input type="text" id="pat-nom"></label>
      <label>Prénom <input type="text" id="pat-prenom"></label>
      <label>Date de naissance <input type="date" id="pat-ddn"></label>
      <label>Sexe
        <select id="pat-sex">
          <option value="">—</option>
          <option value="F">Femme</option>
          <option value="M">Homme</option>
        </select>
      </label>
      <label>Consultation du <input type="date" id="pat-date"></label>
    </div>
    <div id="pat-age-line" class="age-line"></div>
  </section>

  <section class="summary-bar">
    <div id="progress-info">0 / 0 items évalués</div>
    <div class="progress"><div id="progress-fill"></div></div>
    <div class="summary-actions">
      <button id="btn-print">🖨️ Fiche patient (imprimer / PDF)</button>
      <button id="btn-export" class="secondary">📤 Exporter résultat (JSON)</button>
      <button id="btn-reset" class="secondary">↺ Réinitialiser</button>
    </div>
  </section>

  <div id="sections"></div>

</main>

<div id="print-area" class="hidden"></div>

<script>
/* Intégration Python : l'app hôte peut définir window.PATIENT_DATA avant le chargement,
   ou appeler Depistage.setData({...}) (voir integration.md). */
window.PATIENT_DATA = window.PATIENT_DATA || null;
</script>
<script src="app.js"></script>
</body>
</html>
