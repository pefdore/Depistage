<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tour d'horizon 360° — dépistage</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🩺 Tour d'horizon 360° — dépistage</h1>
  <p class="subtitle">Cocher les indications présentes : la conclusion (« à réaliser car… ») s'écrit automatiquement. Recommandations HAS / dépistage organisé français. Risque cardiovasculaire global : risquecv.fr</p>
</header>

<main id="app">

  <section id="patient-info" class="card">
    <h2>Patient</h2>
    <div class="patient-grid">
      <label>Nom <input type="text" id="pat-nom"></label>
      <label>Prénom <input type="text" id="pat-prenom"></label>
      <label>Date de naissance <input type="date" id="pat-ddn"></label>
      <label>Sexe
        <select id="pat-sex">
          <option value="">—</option>
          <option value="F">Femme</option>
          <option value="M">Homme</option>
        </select>
      </label>
      <label>Consultation du <input type="date" id="pat-date"></label>
    </div>
    <div id="pat-age-line" class="age-line"></div>
  </section>

  <section class="summary-bar">
    <div id="progress-info"></div>
    <div class="summary-actions">
      <button id="btn-print">🖨️ Rapport patient</button>
      <button id="btn-print-med" class="secondary">🩺 Rapport médecin</button>
      <button id="btn-export" class="secondary">📤 Exporter (JSON)</button>
      <button id="btn-reset" class="secondary">↺ Réinitialiser</button>
    </div>
  </section>

  <div id="sections"></div>

</main>

<div id="print-area" class="hidden"></div>

<script>window.PATIENT_DATA = window.PATIENT_DATA || null;</script>
<script src="app.js"></script>
</body>
</html>
